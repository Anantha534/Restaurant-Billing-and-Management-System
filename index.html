<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anantha's Kitchen | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>🍽️ Anantha's Kitchen</h1>
            <p>Smart Restaurant Management System</p>
        </div>

        <div class="login-box">
            <h2>Login</h2>

            <form id="login-form" novalidate>
                <label for="email" class="visually-hidden">Email</label>
                <input type="email" id="email" name="email" placeholder="you@restaurant.com" required>

                <label for="password" class="visually-hidden">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Show password">👁️</button>
                </div>

                <p id="error-message" class="error-message"></p>

                <button type="submit">Access Dashboard</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
